name: Publish Packages to GitHub Packages

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"

      - name: Derive version from release tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set package versions
        run: |
          npm version "$PKG_VERSION" --no-git-tag-version --workspace packages/hello-world-button
          npm version "$PKG_VERSION" --no-git-tag-version --workspace packages/red-button

      - run: npm install
      - run: npm run build
      - run: npm publish --workspace packages/hello-world-button
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm publish --workspace packages/red-button
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
